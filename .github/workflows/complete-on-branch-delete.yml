name: Complete issue on branch deletion

on:
  delete:

permissions:
  contents: read

jobs:
  complete-issue:
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest

    steps:
      - name: Move linked issues to Done
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const branch = context.payload.ref;
            const { owner, repo } = context.repo;

            // Buscar PRs mergeadas de la rama eliminada
            const result = await github.graphql(`
              query($owner: String!, $repo: String!, $branch: String!) {
                repository(owner: $owner, name: $repo) {
                  pullRequests(
                    headRefName: $branch,
                    states: [MERGED],
                    first: 10
                  ) {
                    nodes {
                      number
                      isCrossRepository
                      closingIssuesReferences(first: 10) {
                        nodes {
                          number
                          projectItems(first: 100) {
                            nodes {
                              id
                              project { id }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `, { owner, repo, branch });

            const prs = result.repository.pullRequests.nodes
              .filter(pr => !pr.isCrossRepository);

            if (prs.length === 0) {
              core.info("No hay PR mergeada para esta rama.");
              return;
            }

            // Buscar el proyecto GraphMl
            const response = await github.graphql(`
              query($login: String!) {
                user(login: $login) {
                  projectsV2(first: 100) {
                    nodes {
                      id
                      title
                      field(name: "Status") {
                        ... on ProjectV2SingleSelectField {
                          id
                          options { id name }
                        }
                      }
                    }
                  }
                }
              }
            `, { login: "Nachom3" });

            const project = response.user.projectsV2.nodes
              .find(p => p.title.toLowerCase() === "graphml");

            if (!project) {
              throw new Error("No se encontró GraphMl");
            }

            const status = project.field;
            const done = status.options
              .find(o => o.name === "Done");

            if (!done) {
              throw new Error("No existe el estado Done");
            }

            // Actualizar los Issues vinculados
            const itemIds = new Set();

            for (const pr of prs) {
              for (const issue of pr.closingIssuesReferences.nodes) {
                for (const item of issue.projectItems.nodes) {
                  if (item.project.id === project.id) {
                    itemIds.add(item.id);
                  }
                }
              }
            }

            for (const itemId of itemIds) {
              await github.graphql(`
                mutation(
                  $projectId: ID!,
                  $itemId: ID!,
                  $fieldId: ID!,
                  $optionId: String!
                ) {
                  updateProjectV2ItemFieldValue(
                    input: {
                      projectId: $projectId,
                      itemId: $itemId,
                      fieldId: $fieldId,
                      value: {
                        singleSelectOptionId: $optionId
                      }
                    }
                  ) {
                    projectV2Item { id }
                  }
                }
              `, {
                projectId: project.id,
                itemId,
                fieldId: status.id,
                optionId: done.id
              });
            }

            core.info(`Issues completados: ${itemIds.size}`);
